<script>
var COLS_PER_PAGE = 5;
var pagers = {};

function renderTable(data) {
  if (!data || !data.d || data.d.length === 0) {
    return '<table><thead><tr><th></th></tr></thead><tbody></tbody></table>';
  }
  var parts = [];
  parts.push('<table><thead><tr><th>科目</th>');
  for (var i = 0; i < data.d.length; i++) {
    parts.push('<th>', data.d[i], '</th>');
  }
  parts.push('</tr></thead><tbody>');
  for (var mi = 0; mi < data.m.length; mi++) {
    var isH = data.h.indexOf(data.m[mi]) !== -1;
    parts.push('<tr', isH ? ' class="h"' : '', '><td class="m">', data.m[mi], '</td>');
    for (var di = 0; di < data.d.length; di++) {
      var v = data.v[mi][di];
      parts.push('<td class="', v !== '—' ? 'n' : 'n x', '">', v, '</td>');
    }
    parts.push('</tr>');
  }
  parts.push('</tbody></table>');
  return parts.join('');
}

function getDataForTab(tabName) {
  if (tabName === '利润表') {
    var ve = document.querySelector('#tab-利润表 .view-toggle');
    return (ve && ve.value === 'single') ? DATA_income_sq : DATA_income;
  }
  if (tabName === '现金流量表') {
    var ve = document.querySelector('#tab-现金流量表 .view-toggle');
    return (ve && ve.value === 'single') ? DATA_cashflow_sq : DATA_cashflow;
  }
  return DATA_balance;
}

function getActiveTableContainer(tabName) {
  if (tabName === '资产负债表') {
    return document.getElementById('view-资产负债表');
  }
  var ve = document.querySelector('#tab-' + tabName + ' .view-toggle');
  var view = (ve && ve.value === 'single') ? 'single' : 'cumulative';
  return document.getElementById('view-' + tabName + '-' + view);
}

function getFilteredCols(state) {
  var filter = state.filter || '全部';
  if (filter === '全部') {
    var all = [];
    for (var i = 1; i <= state.totalCols; i++) all.push(i);
    return all;
  }
  var filtered = [];
  for (var i = 0; i < state.dates.length; i++) {
    if (state.dates[i].indexOf(filter) !== -1) filtered.push(i + 1);
  }
  return filtered;
}

function initPagination(tabName) {
  var data = getDataForTab(tabName);
  if (!data || data.d.length === 0) return;

  var totalCols = data.d.length;
  var pagerEl = document.getElementById('pager-' + tabName);

  var state = { page: 0, totalCols: totalCols, dates: data.d, filter: '全部' };
  pagers[tabName] = state;

  state.renderButtons = function() {
    var filteredCols = getFilteredCols(state);
    var totalFiltered = filteredCols.length;
    if (totalFiltered === 0) {
      pagerEl.innerHTML = '<span class="page-info">无匹配报告期</span>';
      return;
    }
    var totalPages = Math.ceil(totalFiltered / COLS_PER_PAGE);
    if (state.page >= totalPages) state.page = 0;

    var html = '';
    html += '<button onclick="goPage(\'' + tabName + '\', 0)" ' + (state.page === 0 ? 'disabled' : '') + '>|◁</button>';
    html += '<button onclick="goPage(\'' + tabName + '\', ' + (state.page - 1) + ')" ' + (state.page === 0 ? 'disabled' : '') + '>◀</button>';
    html += '<span class="page-info">第 <strong>' + (state.page + 1) + '</strong> / ' + totalPages + ' 页</span>';
    html += '<button onclick="goPage(\'' + tabName + '\', ' + (state.page + 1) + ')" ' + (state.page >= totalPages - 1 ? 'disabled' : '') + '>▶</button>';
    html += '<button onclick="goPage(\'' + tabName + '\', ' + (totalPages - 1) + ')" ' + (state.page >= totalPages - 1 ? 'disabled' : '') + '>▷|</button>';
    html += ' <select onchange="goPage(\'' + tabName + '\', this.value)">';
    for (var p = 0; p < totalPages; p++) {
      var startIdx = p * COLS_PER_PAGE;
      var endIdx = Math.min((p + 1) * COLS_PER_PAGE - 1, totalFiltered - 1);
      var start = state.dates[filteredCols[startIdx] - 1];
      var end = state.dates[filteredCols[endIdx] - 1];
      html += '<option value="' + p + '"' + (p === state.page ? ' selected' : '') + '>' + start + ' ~ ' + end + '</option>';
    }
    html += '</select>';
    pagerEl.innerHTML = html;
  };

  state.renderButtons();
  showPage(tabName, 0);
}

function showPage(tabName, page) {
  var state = pagers[tabName];
  if (!state) return;

  var container = getActiveTableContainer(tabName);
  var table = container ? container.querySelector('table') : null;
  if (!table) return;

  var filteredCols = getFilteredCols(state);
  if (filteredCols.length === 0) {
    table.querySelectorAll('th, td').forEach(function(cell) {
      if (cell.cellIndex !== 0) cell.hidden = true;
    });
    return;
  }

  var totalPages = Math.ceil(filteredCols.length / COLS_PER_PAGE);
  if (page >= totalPages) page = 0;
  state.page = page;

  var start = page * COLS_PER_PAGE;
  var end = Math.min((page + 1) * COLS_PER_PAGE, filteredCols.length);
  var visibleCols = {};
  for (var i = start; i < end; i++) visibleCols[filteredCols[i]] = true;

  table.querySelectorAll('th, td').forEach(function(cell) {
    var col = cell.cellIndex;
    if (col === 0) return;
    cell.hidden = !visibleCols[col];
  });

  state.renderButtons();
}

function applyFilter(tabName, value) {
  var state = pagers[tabName];
  if (!state) return;
  state.filter = value;
  state.page = 0;
  state.renderButtons();
  showPage(tabName, 0);
}

function switchView(tabName, view) {
  var cumDiv = document.getElementById('view-' + tabName + '-cumulative');
  var singleDiv = document.getElementById('view-' + tabName + '-single');

  if (view === 'single' && cumDiv.style.display !== 'none') {
    var cumTable = cumDiv.querySelector('table');
    var singleTable = singleDiv.querySelector('table');
    if (cumTable && singleTable) {
      var cumThs = cumTable.querySelectorAll('thead th');
      var singleThs = singleTable.querySelectorAll('thead th');
      for (var i = 0; i < Math.min(cumThs.length, singleThs.length); i++) {
        singleThs[i].style.minWidth = cumThs[i].getBoundingClientRect().width + 'px';
      }
    }
  }

  cumDiv.style.display = view === 'cumulative' ? '' : 'none';
  singleDiv.style.display = view === 'single' ? '' : 'none';
  initPagination(tabName);
}

function goPage(tabName, page) {
  showPage(tabName, page);
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  document.querySelector('.tab-btn[onclick*="' + name + '"]').classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

(function() {
  document.getElementById('view-利润表-cumulative').innerHTML = renderTable(DATA_income);
  document.getElementById('view-利润表-single').innerHTML = renderTable(DATA_income_sq);
  document.getElementById('view-现金流量表-cumulative').innerHTML = renderTable(DATA_cashflow);
  document.getElementById('view-现金流量表-single').innerHTML = renderTable(DATA_cashflow_sq);
  var bal = document.getElementById('view-资产负债表');
  if (bal) bal.innerHTML = renderTable(DATA_balance);

  initPagination('利润表');
  initPagination('资产负债表');
  initPagination('现金流量表');
})();
</script>
